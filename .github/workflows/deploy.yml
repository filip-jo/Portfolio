name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Safety check before `mirror --delete`: only deploy into a folder that is
      # empty (first deploy) or holds the .deploy-target marker from a previous
      # deploy. Stops a misconfigured FTP user from wiping another site.
      - name: Check deploy target
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          listing=$(lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            set net:timeout 20;
            cls -1 -a;
            quit")
          listing=$(grep -vxE '\.{1,2}/?' <<< "$listing" || true)
          if [ -n "$listing" ] && ! grep -qx '.deploy-target' <<< "$listing"; then
            echo "::error::The FTP folder is not empty and has no .deploy-target marker. Refusing to deploy. Contents:"
            echo "$listing"
            exit 1
          fi

      # Uploads out/ into the FTP user's home folder (locked to the site's
      # folder on All-inkl) in an order that never leaves a page pointing at
      # missing CSS/JS: first the new hashed assets in _next/, then the pages,
      # deleting pages that are no longer built. Old _next/ assets are kept so
      # tabs opened before a deploy keep working.
      - name: Upload to All-inkl (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            set net:timeout 20;
            set cmd:fail-exit yes;
            mirror --reverse --parallel=4 --verbose out/_next/ _next/;
            mirror --reverse --delete --parallel=4 --verbose --exclude ^_next/ out/ ./;
            quit"
